# Deliberately permissive publish workflow for the P5 traceability demo.
# DO NOT copy this into a real package: the triggers are broad on purpose
# (scenario B) and the build fetches an unpinned external input (scenario C).
name: publish

on:
  push:
    branches: ["**"]   # scenario B: any branch can publish
    tags: ["v*"]       # scenario D: tag pushes publish too
  workflow_dispatch:
    inputs:
      ref:
        description: "Scenario E: commit, tag or branch to check out and publish (same pattern as real release workflows)"
        required: false
        default: ""

permissions:
  id-token: write      # OIDC for npm trusted publishing (provenance is automatic)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Scenario B' (mitigation): GitHub environment `npm-publish` only deploys from main,
    # and the npm trusted-publisher config requires environment npm-publish.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scenario E: on manual dispatch, publish the commit named by `inputs.ref` instead of
      # the commit that triggered the run. The SLSA predicate still records the trigger commit.
      - name: Check out inputs.ref (scenario E)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha="$(git rev-parse --verify --quiet "$REF^{commit}" || git rev-parse --verify --quiet "refs/remotes/origin/$REF^{commit}")"
          git checkout --detach "$sha"
          echo "publishing $(git rev-parse HEAD) while GITHUB_SHA=$GITHUB_SHA"
      # No `registry-url` here: with it, setup-node writes an .npmrc that sends a
      # placeholder NODE_AUTH_TOKEN, and npm uses that instead of the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest   # trusted publishing needs a recent npm CLI
      - name: Diagnostics (no secret values printed)
        run: |
          echo "npm $(npm -v), node $(node -v)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC request URL present: yes"; else echo "OIDC request URL present: no"; fi
      - name: Build-time input (scenario C)
        if: ${{ vars.BUILD_INPUT_URL != '' }}
        run: curl -fsSL "$BUILD_INPUT_URL" -o data.txt
        env:
          BUILD_INPUT_URL: ${{ vars.BUILD_INPUT_URL }}
      - name: Publish only when the commit asks for it
        if: ${{ contains(github.event.head_commit.message, '[publish]') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: npm publish --access public --loglevel verbose
